<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Optotipos • Snellen | E | Landolt C | Números | Infantil + Amsler • Astigmatismo • Duocromático • PDF</title>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root{--fg:#111;--bg:#fff;--mut:#777;--line:#e5e5e5}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
  header .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .btn{padding:6px 10px;border:1px solid #999;background:#f7f7f7;border-radius:6px;cursor:pointer}
  main{display:flex;flex-direction:column;min-height:100vh}
  .stage{flex:1;display:none}
  .stage.active{display:flex}
  .toolWrap{flex:1;display:flex;align-items:center;justify-content:center}
  canvas{max-width:92vw;max-height:78vh;background:var(--bg)}
  .dark{--fg:#f5f5f5;--bg:#0e0f12;--mut:#a7a7a7;--line:#2a2a2a}
</style>
</head>
<body>
<header>
  <div class="grp">
    <label>Modo:
      <select id="mode">
        <option value="snellen" selected>Snellen</option>
        <option value="amsler">Amsler</option>
        <option value="astig">Astigmatismo</option>
        <option value="duo">Duocromático</option>
      </select>
    </label>
  </div>
  <div class="grp">
    <button id="darkToggle" class="btn">Modo oscuro</button>
    <button id="fullToggle" class="btn">Pantalla completa</button>
  </div>
</header>

<main>
  <section id="stageSnellen" class="stage active"><div class="toolWrap"><p>Snellen aquí...</p></div></section>
  <section id="stageAmsler" class="stage"><div class="toolWrap"><p>Amsler aquí...</p></div></section>
  <section id="stageAstig" class="stage"><div class="toolWrap"><p>Astigmatismo aquí...</p></div></section>
  <section id="stageDuo" class="stage"><div class="toolWrap"><canvas id="duo" width="1200" height="800"></canvas></div></section>
</main>

<script>
const DEG=Math.PI/180;
const $=sel=>document.querySelector(sel);
const modeSel=$('#mode');
const stageSnellen=$('#stageSnellen');
const stageAmsler=$('#stageAmsler');
const stageAstig=$('#stageAstig');
const stageDuo=$('#stageDuo');
const duoCanvas=$('#duo');
const darkToggle=$('#darkToggle');
const fullToggle=$('#fullToggle');

fullToggle.addEventListener('click',()=>{
  if(!document.fullscreenElement)document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

darkToggle.addEventListener('click',()=>{document.body.classList.toggle('dark');drawDuo();});

modeSel.addEventListener('change',()=>{
  const m=modeSel.value;
  stageSnellen.classList.toggle('active',m==='snellen');
  stageAmsler.classList.toggle('active',m==='amsler');
  stageAstig.classList.toggle('active',m==='astig');
  stageDuo.classList.toggle('active',m==='duo');
  if(m==='duo')drawDuo();
});

function drawDuo(){
  const c=duoCanvas,ctx=c.getContext('2d');
  const W=c.width,H=c.height;
  ctx.clearRect(0,0,W,H);
  const red='#d00000',green='#00b000';
  ctx.fillStyle=green;ctx.fillRect(0,0,W/2,H);
  ctx.fillStyle=red;ctx.fillRect(W/2,0,W/2,H);

  const letters=[['M','U','O','H'],['H','U','M','O'],['R','U','O','M'],['H','R','M','U']];
  const rows=4,cols=4;
  const marginX=W*0.1,marginY=H*0.18;
  const usableW=W-marginX*2,usableH=H-marginY*2;
  const cellW=usableW/cols,cellH=usableH/rows;
  const size=Math.min(cellW*0.6,cellH*0.6);
  ctx.font=`bold ${size}px Arial`;
  ctx.fillStyle='#000';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let r=0;r<rows;r++){
    for(let c2=0;c2<cols;c2++){
      const x=marginX+c2*cellW+cellW/2;
      const y=marginY+r*cellH+cellH/2;
      ctx.fillText(letters[r][c2],x,y);
    }
  }
  ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
}
</script>
</body>
</html>
