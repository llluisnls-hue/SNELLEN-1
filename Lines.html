<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Optotipos • Snellen | E | Landolt C | Números | Infantil + Amsler • Duocromo • PDF</title>
<!-- jsPDF para exportar -->
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root{--fg:#111;--bg:#fff;--mut:#777;--line:#e5e5e5}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
  header .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  header label{font-size:13px;opacity:.9}
  header input[type="number"],header select{padding:6px}
  header input[type="number"]{width:6.2rem}
  .btn{padding:6px 10px;border:1px solid #999;background:#f7f7f7;border-radius:6px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .small{font-size:12px;color:var(--mut)}
  .pill{padding:6px 10px;border:1px solid #999;border-radius:999px;background:#fafafa;cursor:pointer}
  main{min-height:calc(100vh - 64px);display:flex;flex-direction:column}
  .stage{flex:1;display:none}
  .stage.active{display:flex}
  .chartWrapper{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 10px}
  #chart{width:100%;max-width:1200px;display:grid;gap:18px;align-content:start;justify-items:center}
  .rowWrap{display:flex;flex-direction:column;align-items:center}
  .row{display:flex;gap:1ch;justify-content:center;align-items:flex-end;line-height:1}
  .cell{display:inline-block;font-weight:700;user-select:none;-webkit-user-select:none}
  .tumble{display:inline-block;transform-origin:50% 50%}
  .label{font-size:12px;text-align:center;margin-top:4px;color:var(--mut)}
  /* Calibración */
  .calSection{padding:8px 10px 16px;display:flex;flex-direction:column;align-items:center}
  .barWrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;contain:layout paint}
  .bar{height:12px;background:#ccc;border:1px solid #999;box-shadow:inset 0 0 0 2px #eee;pointer-events:none} #barRange{width:320px}
  /* Amsler / Duocromo */
  .toolWrap{flex:1;display:flex;align-items:center;justify-content:center}
  canvas{max-width:92vw;max-height:78vh;background:var(--bg)}

  /* Duocromo panel */
  .duoPanel{width:min(1100px,92vw);height:min(70vh,620px);display:flex;align-items:center;justify-content:center;border:2px solid var(--line);
    background:linear-gradient(90deg,#1b5e20 0 50%,#c62828 50% 100%);position:relative;border-radius:10px}
  .duoPanel::after{content:"G";position:absolute;left:8px;top:8px;font-weight:700;color:#fff;opacity:.8}
  .duoPanel::before{content:"R";position:absolute;right:8px;top:8px;font-weight:700;color:#fff;opacity:.8}
  .duoRow{display:flex;align-items:flex-end;justify-content:center;gap:1ch;line-height:1;mix-blend-mode:normal}
  .duoCell{font-weight:800;color:#000;text-shadow:0 0 0.9px #000}

  /* Formulario PDF */
  .panel{padding:12px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .panel h3{grid-column:1/-1;margin:.2rem 0}
  .field{display:flex;flex-direction:column}
  .field label{font-size:12px;color:var(--mut)}
  .dark{--fg:#f5f5f5;--bg:#0e0f12;--mut:#a7a7a7;--line:#2a2a2a}
  .dark .btn,.dark .tab,.dark .pill{background:#1b1d22;border-color:#3a3a3a;color:#f1f1f1}
  .dark .duoCell{color:#f5f5f5;text-shadow:0 0 0.9px #f5f5f5}
  /* Ocultar header, calibración y panel inferior en pantalla completa */
  .fs header, .fs .calSection, .fs .panel{display:none}
  /* Ocultar control de vista cuando no aplique */
  .hide{display:none!important}
</style>
</head>
<body>

<header>
  <div class="grp">
    <label>Modo:
      <select id="mode">
        <option value="snellen" selected>Snellen (filas)</option>
        <option value="amsler">Amsler</option>
        <option value="duo">Duocromo (rojo/verde)</option>
      </select>
    </label>
  </div>

  <div class="grp" id="snellenControls">
    <label>Distancia (m):
      <input id="distanceM" type="number" min="0.5" max="10" step="0.1" value="3.0">
    </label>
    <label>Signos:
      <select id="alphabet" title="Sloan / E / Landolt C / Números / Infantil">
        <option value="sloan">Sloan (CDHKNORSVZ)</option>
        <option value="tumbleE">E giratoria (Tumbling-E)</option>
        <option value="landolt">Landolt C</option>
        <option value="digits">Números (2–9)</option>
        <option value="kids">Infantil (▲ ● ■ ★)</option>
      </select>
    </label>
    <label id="viewModeWrap">Vista:
      <select id="viewMode">
        <option value="all">Todas las filas</option>
        <option value="one" selected>Una fila</option>
      </select>
    </label>
    <button id="prevRow" class="btn" title="Fila anterior">⟵ Anterior</button>
    <button id="nextRow" class="btn" title="Fila siguiente">Siguiente ⟶</button>
    <button id="shuffle" class="btn" title="Remezclar (B / .)">↻ Nuevas letras</button>
    <span id="rowInfo" class="small"></span>
    <span class="small" id="seqInfo">Secuencia: 20/400,200,100,70,50,40,30,25,20 • Patrón: 1,2,3,4,5 y luego 6</span>
  </div>

  <div class="grp">
    <button id="darkToggle" class="pill">Modo oscuro</button>
    <button id="fullToggle" class="pill">Pantalla completa</button>
  </div>
</header>

<main>
  <section id="stageSnellen" class="stage active" aria-label="Snellen">
    <div class="chartWrapper">
      <section id="chart"></section>
    </div>
  </section>

  <section id="stageAmsler" class="stage" aria-label="Amsler">
    <div class="toolWrap"><canvas id="amsler" width="900" height="900"></canvas></div>
  </section>

  <section id="stageDuo" class="stage" aria-label="Duocromo">
    <div class="toolWrap">
      <div id="duoPanel" class="duoPanel">
        <div>
          <div id="duoRow" class="duoRow"></div>
          <div id="duoLbl" class="label" style="text-align:center;margin-top:8px"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- CALIBRACIÓN -->
  <section class="calSection" aria-label="Calibración">
    <h3 class="small" style="margin:0 0 6px">Calibración (obligatoria la primera vez)</h3>
    <div class="barWrap">
      <div id="calBar" class="bar" style="width:200px"></div>
      <input id="barRange" type="range" min="50" max="600" step="1" value="200">
      <div>
        <div class="small">Ajusta la barra para que mida <b>50 mm</b>.</div>
        <div class="small">Ancho actual: <span id="barPx">200</span> px → <span id="pxPerMM">4.00</span> px/mm</div>
      </div>
      <button id="lockCal" class="btn">✔ Guardar</button>
      <span id="calStatus" class="small"></span>
    </div>
  </section>

  <!-- PANEL: RESULTADO & PDF -->
  <section class="panel" aria-label="Resultados">
    <h3>Resultado / Historia refracción</h3>
    <div class="field"><label>Paciente</label><input id="p_nombre" placeholder="Nombre completo"/></div>
    <div class="field"><label>Fecha</label><input id="p_fecha" type="date"/></div>
    <div class="field"><label>AV sin corrección OD</label><input id="av_sc_od" placeholder="ej. 20/40"/></div>
    <div class="field"><label>AV sin corrección OI</label><input id="av_sc_oi" placeholder="ej. 20/30"/></div>
    <div class="field"><label>AV con corrección OD</label><input id="av_cc_od" placeholder="ej. 20/20"/></div>
    <div class="field"><label>AV con corrección OI</label><input id="av_cc_oi" placeholder="ej. 20/20"/></div>
    <div class="field"><label>Refracción OD</label><input id="rx_od" placeholder="Sph / Cyl x Eje"/></div>
    <div class="field"><label>Refracción OI</label><input id="rx_oi" placeholder="Sph / Cyl x Eje"/></div>
    <div class="field"><label>DIP / PD</label><input id="dip" placeholder="mm"/></div>
    <div class="field"><label>Adición</label><input id="add" placeholder="+"/></div>
    <div class="field" style="grid-column:1/-1;"><label>Notas</label><textarea id="notas" rows="3" style="width:100%"></textarea></div>
    <div style="grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap">
      <button id="pdfBtn" class="btn">Guardar PDF</button>
    </div>
  </section>
</main>

<script>
/* ==================== Utiles base ==================== */
const DEG=Math.PI/180;
const SLOAN=["C","D","H","K","N","O","R","S","V","Z"];
const DIGITS=["2","3","4","5","6","7","8","9"];
const KIDS=["▲","●","■","★"];
const rand=a=>a[Math.floor(Math.random()*a.length)];
const randE=()=>[0,90,180,270][Math.floor(Math.random()*4)];
const randGap=()=>[0,90,180,270][Math.floor(Math.random()*4)];
const $=sel=>document.querySelector(sel);

const store={
  get pxPerMM(){return parseFloat(localStorage.getItem("pxPerMM")||"")||null;},
  set pxPerMM(v){localStorage.setItem("pxPerMM",String(v));}
};

/* ==================== DOM refs ==================== */
const modeSel=$("#mode");
const snellenControls=$("#snellenControls");
const stageSnellen=$("#stageSnellen");
const stageAmsler=$("#stageAmsler");
const stageDuo=$("#stageDuo");

const distanceM=$("#distanceM");
const alphabetSel=$("#alphabet");
const viewModeWrap=$("#viewModeWrap");
const viewMode=$("#viewMode");
const prevRow=$("#prevRow");
const nextRow=$("#nextRow");
const shuffleBtn=$("#shuffle");
const rowInfo=$("#rowInfo");
const seqInfo=$("#seqInfo");
const chart=$("#chart");

const bar=$("#calBar"), barRange=$("#barRange"),
      barPx=$("#barPx"), pxPerMMEl=$("#pxPerMM"),
      lockCal=$("#lockCal"), calStatus=$("#calStatus");
let rafId=null, pendingBarPx=null;

const darkToggle=$("#darkToggle"), fullToggle=$("#fullToggle");

/* ==================== Pantalla completa ==================== */
function onFSChange(){ document.body.classList.toggle('fs', !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement)); }
document.addEventListener('fullscreenchange', onFSChange);
document.addEventListener('webkitfullscreenchange', onFSChange);
document.addEventListener('mozfullscreenchange', onFSChange);
document.addEventListener('MSFullscreenChange', onFSChange);
function enterFS(){ const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen).call(el); }
function exitFS(){ (document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen).call(document); }
fullToggle.addEventListener('click',()=>{ const active = !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement); if(!active){ enterFS(); } else { exitFS(); } });

/* ==================== Calibración ==================== */
function updateBarUI(px){
  // Batching en rAF para evitar parpadeos, usando width (no transform) para no superponer elementos
  pendingBarPx = px;
  if (rafId) return;
  rafId = requestAnimationFrame(()=>{
    const v = pendingBarPx;
    bar.style.width = v + 'px';
    barPx.textContent = v;
    const ppm = v/50; pxPerMMEl.textContent = ppm.toFixed(2);
    rafId = null;
  });
})`;
    barPx.textContent = v;
    const ppm = v/50; pxPerMMEl.textContent = ppm.toFixed(2);
    rafId = null;
  });
}
barRange.addEventListener("input",e=>updateBarUI(parseInt(e.target.value,10)));
updateBarUI(parseInt(barRange.value,10));
lockCal.addEventListener("click",()=>{
  const ppm=parseFloat(pxPerMMEl.textContent); store.pxPerMM=ppm;
  calStatus.textContent=`Guardado (${ppm.toFixed(2)} px/mm)`; render(false); renderDuo(false);
});
if(store.pxPerMM){ pxPerMMEl.textContent=store.pxPerMM.toFixed(2);
  const px=Math.round(store.pxPerMM*50); barRange.value=px; updateBarUI(px);
  calStatus.textContent="Usando calibración guardada";
}

/* ==================== Carta Snellen ==================== */
const SNELLEN_SEQ=[400,200,100,70,50,40,30,25,20];
const snellenDenoms=n=>SNELLEN_SEQ.slice(0,n);
const logmarFromDen=den=>Math.log10(den/20);
function countsFor(n){
  const out=[]; for(let i=0;i<n;i++){
    if(i===0)out.push(1);else if(i===1)out.push(2);else if(i===2)out.push(3);
    else if(i===3)out.push(4);else if(i===4)out.push(5);else out.push(6);
  } return out;
}
function letterHeightMM(Dm,logMAR){
  const Dmm=Dm*1000, MAR=Math.pow(10,logMAR);
  return 2*Dmm*Math.tan((5*MAR/60)*DEG/2);
}
let lettersCache=[], rotCache=[], gapCache=[], cacheKey='', cacheMode='sloan';
function generateLetters(counts,mode,logsKey){
  cacheKey=counts.join(',')+'|'+logsKey; cacheMode=mode;
  lettersCache=counts.map(cnt=>Array.from({length:cnt},_=>{
    if(mode==='sloan') return rand(SLOAN);
    if(mode==='digits')return rand(DIGITS);
    if(mode==='kids')  return rand(KIDS);
    return mode==='tumbleE'?'E':'C';
  }));
  rotCache=counts.map(cnt=>Array.from({length:cnt},_=>randE()));
  gapCache=counts.map(cnt=>Array.from({length:cnt},_=>randGap()));
}
let currentRow=0; const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function render(regenerate){
  const ppm=store.pxPerMM; chart.innerHTML='';
  if(!ppm){ const p=document.createElement('p'); p.textContent='👉 Calibra la barra a 50 mm y pulsa "Guardar".'; chart.appendChild(p); return;}
  const Dm=parseFloat(distanceM.value||'3')||3.0, nRows=SNELLEN_SEQ.length;
  const denoms=snellenDenoms(nRows), logs=denoms.map(logmarFromDen);
  const counts=countsFor(nRows), mode=alphabetSel.value;
  const logsKey=logs.map(x=>x.toFixed(4)).join(',');
  if(regenerate||cacheKey!==counts.join(',')+'|'+logsKey||cacheMode!==mode){generateLetters(counts,mode,logsKey);}  
  if(viewMode.value==='one'){currentRow=clamp(currentRow,0,counts.length-1); rowInfo.textContent=`Fila ${currentRow+1} / ${counts.length}`;} else rowInfo.textContent='';

  counts.forEach((cnt,idx)=>{
    if(viewMode.value==='one'&&idx!==currentRow) return;
    const logMAR=logs[idx], Hmm=letterHeightMM(Dm,logMAR), Hpx=Hmm*ppm;

    /* gap base y +30% si 20/50, 20/40, 20/30, 20/25, 20/20 */
    const denom = denoms[idx];
    const baseGap = Math.round(Hpx);
    const gapPx = Math.round(baseGap * (denom <= 50 ? 1.3 : 1)); // 30% extra

    const rowWrap=document.createElement('div'); rowWrap.className='rowWrap';
    const row=document.createElement('div'); row.className='row'; row.style.gap=gapPx+'px';

    for(let i=0;i<cnt;i++){
      const cell=document.createElement('div'); cell.className='cell';
      if(mode==='sloan'||mode==='digits'||mode==='kids'){
        cell.textContent=lettersCache[idx][i]; cell.style.fontSize=`${Hpx}px`;
      }else if(mode==='tumbleE'){
        const e=document.createElement('span'); e.className='tumble'; e.textContent='E';
        e.style.fontSize=`${Hpx}px`; e.style.transform=`rotate(${rotCache[idx][i]}deg)`; cell.appendChild(e);
      }else{ // Landolt C
        const c=document.createElement('span'); c.className='tumble'; c.textContent='C';
        c.style.fontSize=`${Hpx}px`; c.style.transform=`rotate(${gapCache[idx][i]}deg)`; cell.appendChild(c);
      }
      row.appendChild(cell);
    }
    const lbl=document.createElement('div'); lbl.className='label';
    lbl.textContent=`20/${denoms[idx]} • logMAR ${logMAR.toFixed(2)}`;
    rowWrap.appendChild(row); rowWrap.appendChild(lbl); chart.appendChild(rowWrap);
  });
}

/* ==================== Amsler ==================== */
function drawAmsler(){
  const c=$("#amsler"),ctx=c.getContext('2d');
  const W=c.width=900,H=c.height=900, step=W/20;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--bg'); ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--fg'); ctx.lineWidth=1;
  for(let i=0;i<=20;i++){
    ctx.beginPath(); ctx.moveTo(i*step,0); ctx.lineTo(i*step,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*step); ctx.lineTo(W,i*step); ctx.stroke();
  }
  ctx.lineWidth=2; ctx.strokeRect(0.5,0.5,W-1,H-1);
  ctx.beginPath(); ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--fg');
  ctx.arc(W/2,H/2,4,0,Math.PI*2); ctx.fill();
}

/* ==================== Duocromo (rojo/verde) ==================== */
function renderDuo(regenerate){
  const ppm=store.pxPerMM; const panel=$('#duoPanel'); const duoRow=$('#duoRow'); const duoLbl=$('#duoLbl');
  duoRow.innerHTML=''; duoLbl.textContent='';
  if(!ppm){ duoLbl.textContent='👉 Calibra la barra a 50 mm y pulsa "Guardar".'; return; }

  const Dm=parseFloat(distanceM.value||'3')||3.0;
  const denoms=snellenDenoms(SNELLEN_SEQ.length); const idx=clamp(currentRow,0,denoms.length-1);
  const logMAR=logmarFromDen(denoms[idx]); const Hpx=letterHeightMM(Dm,logMAR)*ppm;

  // Número de signos: 5 (constante en duocromo)
  const mode=alphabetSel.value;
  // Genera letras LOCALMENTE para no afectar Snellen
  const localLetters = Array.from({length:5},()=>{
    if(mode==='sloan') return rand(SLOAN);
    if(mode==='digits')return rand(DIGITS);
    if(mode==='kids')  return rand(KIDS);
    return mode==='tumbleE'?'E':'C';
  });

  const baseGap=Math.round(Hpx), gapPx=Math.round(baseGap*1.15);
  duoRow.style.gap=gapPx+'px';

  for(let i=0;i<5;i++){
    const cell=document.createElement('div'); cell.className='duoCell';
    if(mode==='tumbleE'){
      const e=document.createElement('span'); e.className='tumble'; e.textContent='E'; e.style.fontSize=`${Hpx}px`; e.style.transform=`rotate(${randE()}deg)`; cell.appendChild(e);
    }else if(mode==='landolt'){
      const c=document.createElement('span'); c.className='tumble'; c.textContent='C'; c.style.fontSize=`${Hpx}px`; c.style.transform=`rotate(${randGap()}deg)`; cell.appendChild(c);
    }else{
      cell.textContent=localLetters[i]; cell.style.fontSize=`${Hpx}px`;
    }
    duoRow.appendChild(cell);
  }
  duoLbl.textContent=`Duocromo • fila 20/${denoms[idx]} • logMAR ${logMAR.toFixed(2)}  —  (←/→ para cambiar, ↻ para remezclar)`;
}

  const Dm=parseFloat(distanceM.value||'3')||3.0;
  const denoms=snellenDenoms(SNELLEN_SEQ.length); const idx=clamp(currentRow,0,denoms.length-1);
  const logMAR=logmarFromDen(denoms[idx]); const Hpx=letterHeightMM(Dm,logMAR)*ppm;

  // Número de signos: 5 (constante en duocromo)
  const mode=alphabetSel.value; if(regenerate){ generateLetters([5],mode,logMAR.toFixed(4)); }
  const letters=(lettersCache[0]&&lettersCache[0].length===5)?lettersCache[0]:Array.from({length:5},()=>{
    if(mode==='sloan') return rand(SLOAN); if(mode==='digits') return rand(DIGITS); if(mode==='kids') return rand(KIDS); return mode==='tumbleE'?'E':'C';
  });

  const baseGap=Math.round(Hpx), gapPx=Math.round(baseGap*1.15);
  duoRow.style.gap=gapPx+'px';

  for(let i=0;i<5;i++){
    const cell=document.createElement('div'); cell.className='duoCell';
    if(mode==='tumbleE'){
      const e=document.createElement('span'); e.className='tumble'; e.textContent='E'; e.style.fontSize=`${Hpx}px`; e.style.transform=`rotate(${randE()}deg)`; cell.appendChild(e);
    }else if(mode==='landolt'){
      const c=document.createElement('span'); c.className='tumble'; c.textContent='C'; c.style.fontSize=`${Hpx}px`; c.style.transform=`rotate(${randGap()}deg)`; cell.appendChild(c);
    }else{
      cell.textContent=letters[i]; cell.style.fontSize=`${Hpx}px`;
    }
    duoRow.appendChild(cell);
  }
  duoLbl.textContent=`Duocromo • fila 20/${denoms[idx]} • logMAR ${logMAR.toFixed(2)}  —  (←/→ para cambiar, ↻ para remezclar)`;
}

/* ==================== Modo / Oscuro ==================== */
function switchMode(){
  const m=modeSel.value;
  const showSnellenControls = (m==='snellen'||m==='duo');
  snellenControls.style.display = showSnellenControls?'flex':'none';

  // Mostrar/ocultar selector de vista y leyenda de secuencia
  const showView = (m==='snellen');
  viewModeWrap.classList.toggle('hide', !showView);
  seqInfo.classList.toggle('hide', !showView);

  stageSnellen.classList.toggle('active', m==='snellen');
  stageAmsler.classList.toggle('active', m==='amsler');
  stageDuo.classList.toggle('active', m==='duo');

  if(m==='snellen') render(false);
  if(m==='amsler') drawAmsler();
  if(m==='duo') renderDuo(false);
}
modeSel.addEventListener('change',switchMode);

darkToggle.addEventListener('click',()=>{ document.body.classList.toggle('dark'); switchMode(); });

/* ==================== Controles Snellen / Duocromo ==================== */
distanceM.addEventListener('input',()=>{ if(modeSel.value==='duo') renderDuo(false); else render(false); });
distanceM.addEventListener('change',()=>{ if(modeSel.value==='duo') renderDuo(false); else render(false); });
alphabetSel.addEventListener('change',()=>{ if(modeSel.value==='duo') renderDuo(true); else render(true); });
prevRow.addEventListener('click',()=>{currentRow=clamp(currentRow-1,0,SNELLEN_SEQ.length-1); if(modeSel.value==='duo') renderDuo(false); else render(false);});
nextRow.addEventListener('click',()=>{currentRow=clamp(currentRow+1,0,SNELLEN_SEQ.length-1); if(modeSel.value==='duo') renderDuo(false); else render(false);});
shuffleBtn.addEventListener('click',()=>{ if(modeSel.value==='duo') renderDuo(true); else render(true); });

/* --- Teclado / Presenter: mapeos --- */
const CYCLE_ALPHABETS=["sloan","tumbleE","landolt","digits","kids"];
function cycleAlphabet(){
  const idx = CYCLE_ALPHABETS.indexOf(alphabetSel.value);
  const next = (idx===-1?0:(idx+1)%CYCLE_ALPHABETS.length);
  alphabetSel.value = CYCLE_ALPHABETS[next];
  if(modeSel.value==='duo') renderDuo(true); else render(true);
}

document.addEventListener('keydown',e=>{
  // Evitar interferir si se está escribiendo
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  if(!(modeSel.value==='snellen' || modeSel.value==='duo')) return;

  // F5 -> cambiar alfabeto (y evitar recarga de la página)
  if(e.key==='F5'){
    e.preventDefault();
    cycleAlphabet();
    return;
  }

  // Remezclar (B o .)
  if(e.key==='b' || e.key==='B' || e.key==='.') { if(modeSel.value==='duo') renderDuo(true); else render(true); e.preventDefault(); return; }

  // Avanzar/retroceder de fila
  if(e.key==='ArrowRight' || e.key==='PageDown' || e.key===' '){
    currentRow = clamp(currentRow+1, 0, SNELLEN_SEQ.length-1);
    if(modeSel.value==='duo') renderDuo(false); else render(false); e.preventDefault(); return;
  }
  if(e.key==='ArrowLeft' || e.key==='PageUp' || e.key==='Backspace'){
    currentRow = clamp(currentRow-1, 0, SNELLEN_SEQ.length-1);
    if(modeSel.value==='duo') renderDuo(false); else render(false); e.preventDefault(); return;
  }
  if(e.key==='ArrowUp'){ currentRow = clamp(currentRow-1, 0, SNELLEN_SEQ.length-1); if(modeSel.value==='duo') renderDuo(false); else render(false); e.preventDefault(); return; }
  if(e.key==='ArrowDown'){ currentRow = clamp(currentRow+1, 0, SNELLEN_SEQ.length-1); if(modeSel.value==='duo') renderDuo(false); else render(false); e.preventDefault(); return; }
});

/* ==================== PDF ==================== */
const PDFField = id => document.getElementById(id)?.value?.trim()||'';
document.getElementById('pdfBtn').addEventListener('click', ()=>{
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt',format:'a4'});
  const mm = v => v*2.83465;
  const lineH = 18, left = mm(20), top = mm(20);
  let y = top;

  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Resultado de Refracción / Agudeza Visual', left, y); y += lineH*1.5;

  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  const rows = [
    ['Paciente', PDFField('p_nombre') || '—'],
    ['Fecha', PDFField('p_fecha') || '—'],
    ['AV SC OD', PDFField('av_sc_od') || '—'],
    ['AV SC OI', PDFField('av_sc_oi') || '—'],
    ['AV CC OD', PDFField('av_cc_od') || '—'],
    ['AV CC OI', PDFField('av_cc_oi') || '—'],
    ['Refracción OD', PDFField('rx_od') || '—'],
    ['Refracción OI', PDFField('rx_oi') || '—'],
    ['DIP/PD', PDFField('dip') || '—'],
    ['Adición', PDFField('add') || '—']
  ];
  rows.forEach(r=>{ doc.text(`${r[0]}: ${r[1]}`, left, y); y += lineH; });

  y += lineH*0.5;
  doc.setFont('helvetica','bold'); doc.text('Notas:', left, y); y += lineH;
  doc.setFont('helvetica','normal');
  doc.text((PDFField('notas')||'—'), left, y, {maxWidth: mm(170)});

  doc.line(left, mm(270), mm(100), mm(270));
  doc.text('Firma / Sello', left, mm(280));

  const nombre = (PDFField('p_nombre')||'refraccion').replace(/\s+/g,'_');
  doc.save(`resultado_${nombre}.pdf`);
});

function init(){
  switchMode(); // renderiza el modo actual
  drawAmsler(); // precalienta el canvas de Amsler
}
init();
